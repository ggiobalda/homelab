services:
  gluetun:
    image: qmcgaw/gluetun:v3
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - ${LAN_IP}8080:8080 # Exposes qBittorrent Web UI to your local LAN
    env_file:
      - ../.env
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_PROVIDER}
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${VPN_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${VPN_ADDRESS}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
      - SERVER_CITIES=${VPN_CITY}
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    env_file:
      - ../.env
    environment:
      - PUID=${UID}
      - PGID=${GUID}
      - WEBUI_PORT=8080
    volumes:
      - ${APPDATA_PATH}/qbittorrent:/config
      - ${DATA_PATH}/audiobookshelf/audiobooks:/audiobooks
      - ${DATA_PATH}/audiobookshelf/podcasts:/podcasts
      - ${DATA_PATH}/jellyfin/movies:/movies
      - ${DATA_PATH}/jellyfin/shows:/shows
      - ${DATA_PATH}/navidrome:/music
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true
    restart: unless-stopped 
