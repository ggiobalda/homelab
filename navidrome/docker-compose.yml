services:
  navidrome:
    image: navidrome/navidrome:latest
    container_name: navidrome
    user: ${UID}:${UID} # must own the data folder and be able to read music folder(s). See Permissions below
    ports:
      - "4533:4533"
    restart: unless-stopped
#    environment:
      # Optional: put your config options customization here. Examples:
      # ND_LOGLEVEL: debug
    volumes:
      - "${APPDATA_PATH}/navidrome/data:/data"
      - "${DATA_PATH}/navidrome:/music:ro"
    env_file:
      - ../.env
